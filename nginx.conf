# Nginx Configuration for KASP Mother Portal & Wildcard Agent Subdomains (*.kasp.ir)

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=kasp_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=kasp_auth_limit:10m rate=3r/s;

# Upstream Node.js App Cluster
upstream kasp_app_cluster {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kasp.ir *.kasp.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block (kasp.ir and *.kasp.ir)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kasp.ir *.kasp.ir;

    # SSL Certificates (Let's Encrypt / Certbot Wildcard)
    ssl_certificate /etc/letsencrypt/live/kasp.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasp.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /var/www/kasp/dist;
    index index.html;

    # API Proxy Rate Limiting
    location /api/ {
        limit_req zone=kasp_api_limit burst=20 nodelay;
        proxy_pass http://kasp_app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth Rate Limiting
    location /api/auth/ {
        limit_req zone=kasp_auth_limit burst=5 nodelay;
        proxy_pass http://kasp_app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # SPA Fallback for Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

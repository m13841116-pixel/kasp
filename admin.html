<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasp.ir Admin Dashboard & Freelancer CRM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              kasp: {
                dark: '#0b132b',
                card: '#1c2541',
                accent: '#3b82f6',
                purple: '#7c3aed'
              }
            }
          }
        }
      }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .glass-panel {
        background: rgba(28, 37, 65, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .gradient-text {
        background: linear-gradient(135deg, #60a5fa 0%, #c084fc 50%, #f472b6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body class="bg-[#0b132b] text-slate-100 min-h-screen antialiased">
    <!-- Standalone Admin Mounting Container / Redirect to SPA Admin Mode -->
    <div id="root"></div>

    <script type="module">
      // If loaded directly, ensure React app switches view to admin tab
      window.addEventListener('DOMContentLoaded', () => {
        window.location.hash = '#admin';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
